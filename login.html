<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log masuk · PTIS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="assets/img/favicon-64.png?v=1.9.37" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="assets/css/app.css?v=1.9.37">
</head>
<body>
  <main class="auth-gate">
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <span class="eyebrow">PTIS</span>
      <h1 id="authTitle">Log masuk</h1>
      <p>Gunakan akaun rasmi (<span id="authDomains"></span>) untuk mengakses data pasukan.</p>
      <div id="authButton" class="auth-button"></div>
      <p id="authError" class="auth-error" role="alert" hidden></p>
      <button type="button" class="btn btn-ghost" id="authDemo">Teruskan dalam Mod Demo</button>
    </div>
  </main>

  <script src="assets/js/config.js?v=1.9.37"></script>
  <script src="assets/js/auth.js?v=1.9.37"></script>
  <script src="assets/js/store.js?v=1.9.37"></script>
  <script>
    (function () {
      if (!Auth.required() || Auth.getSession()) {
        location.replace('index.html');
        return;
      }
      Auth.renderLogin({
        onDemo: function () {
          Store.saveConfig({ url: '' });
          location.replace('index.html');
        }
      });
    })();
  </script>
</body>
</html>
